<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>AI-Sister icon source</title>
    <!--
      應用程式圖示的「原稿」。它不是一張圖檔，是這一頁——
      `scripts/make-icons.sh` 用瀏覽器把它渲染成 PNG，再轉成 .ico。

      這樣做的理由跟字母人本身一樣：這個 repo 裡不能有來路不明的圖。
      角色是 CSS，圖示就從同一份 CSS 長出來，於是「圖示的授權是什麼」
      這個問題不存在——它是我們自己畫的一個字。

      這一頁**不在** ui/ 底下，因為它不該被打包進應用程式。
    -->
    <style>
      html,
      body {
        background: transparent;
        height: 100%;
        margin: 0;
      }
      body {
        align-items: center;
        display: flex;
        justify-content: center;
      }
      .face {
        --letter-bg: #f6ecdf;
        --letter-fg: #2e2140;
        align-items: center;
        background: var(--letter-bg);
        border: 20px solid var(--letter-fg);
        border-radius: 118px;
        box-shadow:
          inset 0 -54px 0 rgb(46 33 64 / 6%),
          0 34px 0 var(--letter-fg);
        color: var(--letter-fg);
        display: flex;
        /* 字要大到 32px 的工作列圖示還讀得出來。第一版是 236px（佔 54%），
           縮到 32 之後只剩一個小點在框裡。 */
        font: 900 310px/1 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
        height: 440px;
        justify-content: center;
        width: 440px;
      }
      .glyph {
        transform: translateY(-8px);
      }
    </style>
  </head>
  <body>
    <div class="face"><span class="glyph">S</span></div>
  </body>
</html>
