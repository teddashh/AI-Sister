<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>AI-Sister icon source</title>
    <!--
      應用程式圖示的排版原稿。`scripts/make-icons.sh` 用瀏覽器把 bundled ChatGPT
      角色圖裁成 PNG，再轉成 .ico。原圖的來源在
      `ui/personas/{manifest.json,NOTICE.md}`；五個衍生圖示自己的 exact bytes、
      recipe 與權利邊界在 `src-tauri/icons/{manifest.json,NOTICE.md}`，這裡不另造
      一個字母替身。

      這一頁**不在** ui/ 底下，因為它不該被打包進應用程式。
    -->
    <style>
      html,
      body {
        background: transparent;
        height: 100%;
        margin: 0;
      }
      body {
        align-items: center;
        display: flex;
        justify-content: center;
      }
      .face {
        --letter-bg: #f6ecdf;
        --letter-fg: #2e2140;
        align-items: center;
        background: var(--letter-bg);
        border: 20px solid var(--letter-fg);
        border-radius: 118px;
        box-shadow:
          inset 0 -54px 0 rgb(46 33 64 / 6%),
          0 34px 0 var(--letter-fg);
        display: flex;
        height: 440px;
        justify-content: center;
        overflow: hidden;
        position: relative;
        width: 440px;
      }
      img {
        height: 880px;
        left: 50%;
        object-fit: contain;
        position: absolute;
        top: -8px;
        transform: translateX(-50%);
        width: 880px;
      }
    </style>
  </head>
  <body>
    <div class="face"><img src="../ui/personas/chatgpt.webp" alt="" /></div>
  </body>
</html>
