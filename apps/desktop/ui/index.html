<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      連線一律不准。這個視窗永遠只讀本機檔案與 Tauri 的 IPC——沒有 CDN、
      沒有字型、沒有 analytics。CSP 寫在這裡而不只是 tauri.conf.json，是為了
      讓「她不連外」這句話在使用者按 Ctrl+U 的時候自己看得到。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src data:; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>AI-Sister</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 拖曳條。Tauri 只有一個 webview，所以拖曳是 `data-tauri-drag-region`
         的事，不像 Electron 要另外開一層 chrome。 -->
    <header class="dragbar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>AI-Sister</span>
      <!-- 暫停排在最前面。她整個產品的前提是「你隨時停得掉」，那顆鍵就不該
           藏在設定裡——它跟置頂、收起來是同一級的東西。 -->
      <button class="control" id="pause" type="button" title="暫停記錄">⏸</button>
      <!-- 「她記得什麼」要和「暫停」放在一起。使用者會想關掉她，多半是因為
           不確定她記了什麼——把翻帳本的入口藏起來，等於逼他用猜的。 -->
      <button class="control" id="timeline" type="button" title="她記得的每一天">
        ▤
      </button>
      <button class="control" id="pin" type="button" title="保持在最上層">●</button>
      <button class="control" id="hide" type="button" title="收到系統匣">−</button>
    </header>

    <main class="stage">
      <!-- 原生 button 自己提供 Enter／Space 語意；不要手寫 keydown 再觸發一次，
           否則瀏覽器合成的 click 會讓一個按鍵說兩句。 -->
      <button class="avatar" data-avatar type="button">
        <span class="face">
          <!-- fixed pack 尚未接入時永遠 hidden；字母 fallback 不依賴它。 -->
          <img class="portrait" data-persona-portrait alt="" draggable="false" hidden />
          <span class="glyph" data-persona-glyph>S</span>
        </span>
      </button>
      <p class="state-line" data-state-line>在聽</p>
      <!-- 只有使用者點上面的 button 才會填字；開場、輪詢與 timer 都不碰這一格。 -->
      <p class="persona-line" data-persona-line aria-live="polite" hidden></p>
      <!-- 不 autoplay。未來本機 fixed pack 的固定台詞也只能從同一次 click 播。 -->
      <audio data-persona-audio preload="none" hidden></audio>
      <!--
        只在「沒有人在記錄」的時候出現。她已經說得出那句話了，但說完之後
        使用者唯一的下一步是開一個終端機打指令——而 Phase 1 的退場條件是
        自用 7 天。把那一步放在她講那句話的正下方。
      -->
      <button class="wake" data-wake type="button" hidden>開始記錄</button>
      <section class="utterance" data-utterance hidden>
        <p class="utterance-text" data-utterance-text></p>
        <div class="utterance-evidence" data-utterance-evidence></div>
        <!-- 出處要自己一行、排在按鈕上面。放在 .utterance-actions 裡面不行——
             那個容器是 display:flex，這句話會變成跟「結案」「其他」併排的 flex
             項目，而不是按下去之前先讀到的一句話。 -->
        <p class="utterance-target-provenance" data-utterance-target-provenance hidden></p>
        <div class="utterance-actions" data-utterance-actions>
          <button type="button" data-utterance-suggestion hidden></button>
          <button type="button" data-utterance-close>結案</button>
          <button type="button" data-utterance-other>其他</button>
        </div>
        <p class="utterance-result" data-utterance-result></p>
      </section>
      <!--
        她問的那一題（PHASES #42）。**只在他還沒答過的時候出現**——一個問過
        的問題再問一次是騷擾，而這個視窗整天掛在螢幕角落。

        兩顆按鈕的字不寫在這裡，是從 `sister_hands::url_policy::UrlOpenAnswer`
        拿的：同一題 `sister url-policy` 也在問，文案分兩份的話他答的是哪一個
        沒人說得準。
      -->
      <section class="asked" data-url-policy hidden>
        <p class="asked-question" data-url-policy-question></p>
        <!-- 「還沒答之前我怎麼做」。少了這一句，一個從來沒被問過的人會以為
             現在這個行為是他自己選的。 -->
        <p class="asked-note" data-url-policy-note></p>
        <div class="asked-actions" data-url-policy-actions></div>
        <p class="asked-result" data-url-policy-result aria-live="polite"></p>
      </section>
      <aside class="gate-debug" data-gate-debug hidden></aside>
      <aside class="hands-log" data-hands-log aria-label="行動紀錄"></aside>
      <!-- 每一筆答案都掛著出處。沒有出處的那一行不會出現在這裡。 -->
      <ul class="hits" data-hits hidden></ul>
    </main>

    <footer class="ask">
      <input
        class="ask-input"
        data-ask-input
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="問我一件事…"
      />
      <button class="ask-send" data-ask-send type="button" title="問">→</button>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
