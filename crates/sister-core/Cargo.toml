[package]
name = "sister-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AI-Sister core: L0/L1 truth model, local storage, zero-LLM fact extraction"

[features]
default = ["bundled-sqlite"]
# 自帶 SQLite 原始碼編譯。出貨一定要開——使用者的機器上不保證有 sqlite3。
#
# 關掉它的唯一用途是從 Linux 對 Windows 做 `cargo check`：bundled 會叫
# libsqlite3-sys 用 MSVC 相容的編譯器去編 sqlite3.c，而交叉檢查的機器上
# 沒有。`cargo check` 本來就不連結，所以關掉之後型別檢查完全不受影響。
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
directories.workspace = true
getrandom.workspace = true

# **只有測試用得到，出貨的相依樹裡沒有它。**
#
# reviewer 寫進 `commitments.allowed_next_step` 的那一串 JSON，全世界只有
# `sister_hands::SuggestionButton::parse_json` 會去讀。兩邊都有測試，但兩邊
# 的測試都是拿自己那一半去比對一段寫死的字面值——欄位改名、或
# `deny_unknown_fields` 多擋掉一個欄位，兩邊照樣全綠，壞掉的地方要等到他按
# 下去那一刻才會出現。那條縫需要有人站在中間，而站得到的人必須同時看得見兩
# 個 crate。
#
# 挑 dev-dependency，而不是把測試放進本來就同時看得見兩邊的 `apps/desktop`：
# CI 對那個 crate 只跑 clippy 和 build，沒有 `cargo test`，而且它在 Linux 上
# 缺 dbus 連編都編不起來。放在那裡的測試等於沒寫——`target_policy` 當初就是
# 為了同一件事搬出來的。
#
# `scripts/check-no-network.sh` 走 `--edges normal`，dev-dependency 不會被算
# 進去。這不是繞過它，是那支 script 開頭第 16 行就寫明的選擇；sister-hands
# 自己的相依只有 anyhow / serde / serde_json。
[dev-dependencies]
sister-hands.workspace = true
