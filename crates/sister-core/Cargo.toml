[package]
name = "sister-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AI-Sister core: L0/L1 truth model, local storage, zero-LLM fact extraction"

[features]
default = ["bundled-sqlite"]
# 自帶 SQLite 原始碼編譯。出貨一定要開——使用者的機器上不保證有 sqlite3。
#
# 關掉它的唯一用途是從 Linux 對 Windows 做 `cargo check`：bundled 會叫
# libsqlite3-sys 用 MSVC 相容的編譯器去編 sqlite3.c，而交叉檢查的機器上
# 沒有。`cargo check` 本來就不連結，所以關掉之後型別檢查完全不受影響。
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
directories.workspace = true
getrandom.workspace = true
# 字母人建議按鈕上的兩句話（`suggestion_text`）和「要不要去查那筆 fact」
# （`target_app_for_button`）都吃 `SuggestionButton`。這兩支以前住在
# `apps/desktop`，那裡的 `#[test]` 從來沒跑過；搬進來之後 `cargo test
# --workspace` 才真的會執行。
#
# 測試也用得到它：reviewer 寫進 `commitments.allowed_next_step` 的那一串
# JSON，全世界只有 `sister_hands::SuggestionButton::parse_json` 會去讀。
# 兩邊各自拿寫死的字面值跟自己比對，欄位改名兩邊照樣全綠——那條縫需要有
# 人站在中間。
#
# sister-hands 的相依是 anyhow / serde / serde_json / chrono，**加上 alpha.96 起的
# `global-hotkey`**：撞號判定要用真正負責註冊的那支 parser，不要手抄別名表。
# 那一筆連帶把 x11rb / keyboard-types / crossbeam-channel / rustix 一族拉進
# `sister.exe` 的相依樹（實測 `cargo tree -p sister-cli --edges normal` 從 90 個
# crate 變 101 個）。裡面沒有 HTTP client，所以 `scripts/check-no-network.sh`
# 要擋的那件事沒有變——但那道閘門的 `FORBIDDEN` 名單是逐個列的，新進來的這幾個
# 它不認得，別把「它還是綠的」讀成「它看過這幾個了」。
sister-hands.workspace = true
