[package]
name = "sister-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AI-Sister command line: record, replay, query, stats, doctor"

[[bin]]
name = "sister"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["sister-core/bundled-sqlite", "sister-capture/bundled-sqlite"]

[dependencies]
sister-core.workspace = true
sister-capture.workspace = true
# `sister forget` 要把 action log 裡那一段也刪掉。字母人和 CLI 寫的是**同一個
# 資料夾裡的同一個檔案**，所以「忘掉」不能只有其中一支做得到——否則他用 CLI
# 忘掉一個下午，那個下午開過的網址還躺在 `action-log.jsonl` 裡，而畫面上寫的
# 是「已經忘掉了」。格式歸 sister-hands 管，這裡不自己再寫一份 parser。
sister-hands.workspace = true
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
shlex = "1"

# 只為了 Ctrl-C 收尾。與其為這一件事多拉一個相依套件，不如直接用平台 API。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
