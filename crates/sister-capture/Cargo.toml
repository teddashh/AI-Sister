[package]
name = "sister-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AI-Sister capture layer: platform traits, replay backend, recording loop"

[features]
default = ["bundled-sqlite", "macos"]
bundled-sqlite = ["sister-core/bundled-sqlite"]
# macOS 14+ production backend：ScreenCaptureKit 擷取、Vision OCR 與 AX privacy gate。
macos = [
    "dep:apple-metal",
    "dep:accessibility",
    "dep:accessibility-sys",
    "dep:core-foundation",
    "dep:cocoa",
    "dep:objc",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-application-services",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-vision",
    "dep:screencapturekit",
]
# 原生 app-tree smoke 額外打開私有 probe argument；正式 artifact 只用 `macos`。
macos-ci-spike = ["macos"]

[dependencies]
sister-core.workspace = true
sister-hands.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
image.workspace = true

# 平台相依的部分只在該平台編譯。Linux 上的開發機不會因此付出任何代價，
# 而 `cargo check --target x86_64-pc-windows-msvc` 仍然檢查得到這些程式碼。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # 系統內建 OCR（Windows.Media.Ocr）需要的 WinRT 那一半
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_System_WinRT",
    # 以下是 Win32 那一半
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    # 量她自己的 CPU 與記憶體（GetProcessMemoryInfo）
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# X11 Preview 走 x11rb 自己的純 Rust transport，不啟用 XCB FFI／dlopen。
# `image` 供之後把 GetImage reply 正規化，`randr` 供 monitor 枚舉；先不把
# xinput／xfixes 等尚未實作的能力一起帶進來。
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false, features = ["image", "randr"] }
atspi-common = { version = "=0.13.0", default-features = false, features = ["zbus"] }
zbus = { version = "=5.12.0", default-features = true }
wait-timeout = "=0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit 9.0.1 supports apple-metal >=0.6,<0.9. Versions after
# 0.6.0 compile macOS 26 Metal state APIs even when only the macOS 14 SCK
# feature is enabled, so they require an SDK newer than the macOS 15 runner.
apple-metal = { version = "=0.6.0", default-features = false, optional = true }
accessibility = { version = "=0.2.0", optional = true }
accessibility-sys = { version = "=0.2.0", optional = true }
core-foundation = { version = "=0.10.1", optional = true }
cocoa = { version = "=0.26.1", optional = true }
objc = { version = "=0.2.7", optional = true }
objc2 = { version = "=0.6.2", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"], optional = true }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["AXError", "AXUIElement", "HIServices", "libc"], optional = true }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay", "CGWindow"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString"], optional = true }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"], optional = true }
screencapturekit = { version = "=9.0.1", default-features = false, features = ["macos_14_0"], optional = true }
