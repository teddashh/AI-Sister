name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux 上跑的是平台無關的那一半：核心邏輯、L1 抽取、replay、隱私驗證。
  linux:
    name: Linux — test, lint, privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # 敏感排除是 Phase 0 的 exit criteria，值得單獨、顯眼地跑一次
      - name: Privacy — sensitive content must never reach disk
        run: cargo test -p sister-capture --test privacy -- --nocapture

      # PRIVACY.md 說「整個 repo 搜不到 HTTP client」。這一步讓那句話由 CI
      # 保證，而不是由記性保證——缺口通常是相依套件帶進來的，不是人手動加的。
      - name: Privacy — there must be no HTTP client in the shipped binary
        run: ./scripts/check-no-network.sh

      # Windows 那一半在 Linux 上被 cfg 關掉，這裡至少要型別檢查到
      - name: Cross-check the Windows half
        run: ./scripts/check-windows.sh

  # 真正的 Windows：這裡才會連結、才會執行 Win32 的單元測試。
  windows:
    name: Windows — test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 這一步是 Linux 上做不到的事：Win32 程式碼真的被執行
      - name: Test
        run: cargo test --workspace

      # runner 預設只有英文 OCR，於是「中文會不會被逐字切開」這一題永遠停在
      # 「跳過」——而那是這個產品的主要語言。裝上繁中語言包讓它真的被驗到。
      #
      # 只在打 tag 或手動觸發時跑：`Add-WindowsCapability` 要跟 Windows Update
      # 要一份 FOD，實測會掛在那裡超過 20 分鐘（很可能被 runner 的網路擋掉）。
      # 每次 push 都付這個代價不值得，但每次發版驗一次值得。
      # timeout + continue-on-error 是為了讓它最壞情況只是浪費幾分鐘，不會卡死。
      - name: Install Traditional Chinese OCR language pack
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 8
        shell: powershell
        run: |
          foreach ($cap in @("Language.Basic~~~zh-TW~0.0.1.0", "Language.OCR~~~zh-TW~0.0.1.0")) {
            Write-Host "Installing $cap"
            try { Add-WindowsCapability -Online -Name $cap -ErrorAction Stop | Out-Null }
            catch { Write-Host "  failed: $_" }
          }
          Get-WindowsCapability -Online -Name "Language.OCR*" |
            Where-Object State -eq Installed | Select-Object -ExpandProperty Name

      # 微軟的文件說 Windows.Media.Ocr 需要 package identity，也就是這支
      # 沒打包的 exe 理論上叫不動它。實務上叫得動——這一步就是把「理論上」
      # 換成實測。--nocapture 是為了讓辨識結果直接印在 log 裡：CI 記錄的是
      # 這台機器上裝了哪些 OCR 語言、以及中文到底有沒有被逐字切開。
      - name: OCR — really run it on real Windows
        run: cargo test -p sister-capture --test windows_ocr -- --nocapture

      - name: Build release
        run: cargo build --release -p sister-cli

      # Phase 0 的 exit criteria，在真正的 Windows 上驗一次：
      # 「sister query 電話 能撈回三天前畫面上的電話，附出處」。
      # 斷言看 JSON 裡的正規化值，避免主控台的中文編碼影響判定。
      - name: Smoke test — Phase 0 exit criterion on real Windows
        shell: bash
        run: |
          set -euo pipefail
          S=./target/release/sister.exe
          $S --version
          $S --data-dir ./smoke doctor
          $S --data-dir ./smoke replay scenarios/bill-lookup.json --days-ago 3
          $S --data-dir ./smoke stats

          $S --data-dir ./smoke query 電話 --json > out.json
          cat out.json
          grep -q '"+886800080123"' out.json \
            || { echo "::error::query 電話 沒有撈回三天前的客服電話"; exit 1; }
          grep -q '"frame_id"' out.json \
            || { echo "::error::答案沒有附出處"; exit 1; }

      - name: Upload sister.exe
        uses: actions/upload-artifact@v4
        with:
          name: sister-windows-x64
          path: target/release/sister.exe
          if-no-files-found: error
          retention-days: 30

  # 打 tag 才發 release，這樣才有一個不用登入就能下載的連結。
  release:
    name: Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sister-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: sister.exe
          generate_release_notes: true
          body: |
            單一執行檔，不需要安裝，沒有任何外掛 DLL 或模型檔。

            ```
            sister.exe doctor                 # 先看這個：她在這台機器上做得到什麼
            sister.exe record --duration 60   # 錄一分鐘（省略 --duration 就錄到 Ctrl-C）
            sister.exe stats                  # 記了多少
            sister.exe query 電話             # 查，每筆都附出處
            sister.exe prune --dry-run        # 保留期現在會刪掉什麼
            ```

            資料放在 `%APPDATA%\ted-h\AI-Sister\data\`，刪掉那個資料夾就等於
            全部忘掉。也可以用 `--data-dir .\test` 錄到別的地方，測完直接刪。

            ### 先跑 `doctor`

            它會誠實列出**現在失效的東西**，而不是報一排 ✓。而且它的每一個 ✓
            都是**真的做成了一件事**，不是「某個物件建得起來」——alpha.1 就是
            在這裡騙了自己：`✓ OCR 語言 zh-Hant-TW` 是真的，錄一分鐘卻一個字
            都沒進資料庫。現在 `doctor` 會：

            - 讀一張**編進執行檔**的圖（答案已知），印出實際讀到的行數與樣本
            - 讀**你現在這台螢幕**，印出行數、樣本，以及畫面的亮度範圍
              （整張同一個亮度 = 擷取失敗，不是「畫面上沒有字」）
            - **真的裝一次** input hook 再回報，不再憑空宣稱
            - **真的去讀一次**前景視窗的網址（見下）

            ### 這一版：保留期真的會刪東西了

            `RetentionConfig` 一直都在，`doctor` 一直印著「保留期　畫面 30 天」，
            THREAT_MODEL 還把它列為爆炸半徑控制——而在這一版之前，**整份程式碼
            裡沒有任何一行 DELETE**。磁碟會一直長，而且沒有任何一刻會出事，
            所以沒有人會發現。

            - 過 30 天：刪掉 PNG 檔本身，**但保留那一列與它上面的字**。
              三個月前那通客服電話還查得到，只是點不開當時的截圖。
            - 過 365 天：整列連同文字、事實、FTS 索引一起消失。
            - 每次開始錄製時自動跑一次（不是收工時——收工有太多種方式不會
              發生：Ctrl-C、當機、關機、拔電）。
            - `sister prune --dry-run` 先看會刪掉什麼，一個位元組都不動。

            ### 這一版：把量到的那三個數字修回預算內

            alpha.4 第一次量得到自己，然後量出來的東西很難看：
            **CPU 27.1%（預算 3%）、磁碟 11.4 GB/天（預算 300MB/天）**，
            而且 OCR 把 `Microsoft Teams` 讀成 `Micr099ftTeamsTr`。

            三個症狀是同一個原因：**一份像素同時被拿去做三件需求互相衝突
            的事**。去重只需要 9×8、OCR 需要原生解析度、存檔想要小，而它們
            共用一張縮到 1568 的圖——對三邊都是錯的。

            - **兩段式抓圖。** 每個 tick 只抓一張 256px 的探測圖算雜湊
              （`GetDIBits` 要搬的位元組從 14MB 掉到 147KB）；只有畫面**真的
              變了**才付原生解析度的錢。實測 120 個 tick 裡有 103 個是重複的
              ——那 86% 以前每一次都搬了一整張圖然後丟掉。
            - **OCR 改看原生像素。** 2560 縮到 1568 是 0.61 倍，12px 的字掉到
              7px，於是引擎不報錯、只是讀錯。
            - **畫面檔兩道閘門**：最小間隔（預設 5 秒）管速率，每日上限
              （預設 250MB）管總量。單靠間隔擋不住——5 秒一張的最壞情況
              一天還是 17,280 張。
              **被跳過的只有 PNG，文字照常全部進索引**：搜尋結果一筆都不會
              少，只是其中一些點下去沒有圖。摘要會直接講這件事。

            錄完的摘要現在還會把時間拆到每個階段：

            ```
            時間：120 tick 共忙了 3.2 秒（每 tick 27 ms）
                  OCR      1.42 秒 /  44%     17 次，每次 83.5 ms
                  抓圖     0.91 秒 /  28%     17 次，每次 53.5 ms
                  探測     0.55 秒 /  17%    120 次，每次 4.6 ms
            ```

            會有這一段，是因為我為了那個 27% 猜了兩次原因，兩次都猜 PNG
            編碼太慢，兩次都錯（實測編一張只要 1.7ms）。**一個沒辦法歸因的
            數字，會讓人去修最好修的地方，而不是最貴的地方。** 磁碟也同理，
            現在拆成「畫面」與「其他」，而且超出預算她會自己說。

            ### 網址與密碼欄（UIA，alpha.3 起）

            在那之前 `doctor` 會說「✗ 沒有 UIA 網址擷取」，那代表 16 條
            網銀／登入頁排除規則**一條都不生效**。現在接上了：

            - **只對瀏覽器呼叫**。UIA 的呼叫沒有辦法取消，對方卡住我們就跟著
              卡住，所以一天裡絕大多數時間完全不碰它——那本身就是一項功能。
              代價：非瀏覽器（RDP 登入框、VPN 用戶端）的密碼欄看不到。
            - **關在一條可以丟掉的執行緒裡**。卡超過 0.9 秒就整條放棄、不等它。
              連續放棄三次就宣告這台機器讀不到網址，不再嘗試。
            - **焦點在密碼欄上時整幀不擷取**。問不出來也算「是」——少擋了你
              永遠不會發現，多擋了你會來抱怨然後我們修得掉。
            - 讀回來的網址是**縮寫過的**（`example.com/a`，不是
              `https://www.example.com/a`）。規則是子字串比對所以照樣命中，
              但寫成 `https://*bank*` 的規則永遠不會生效——`doctor` 會把這種
              規則挑出來。

            ### 錄完的摘要現在說得出「為什麼」

            - `讀字：N 行` — 保留了幾張畫面是**容量**，讀到了幾行字才是**記憶**。
              `kept > 0` 而讀字 = 0 會直接示警，OCR 失敗也會印出是哪一步壞的。
            - `排除 N 次：<理由>` — 拆開到每一條規則。一條寬到吃掉一整天的
              規則，症狀本來只是一個沒有解釋的數字。
            - `⚠ 錄製途中失去的能力` — `doctor` 只看得到開機那一瞬間，但 UIA
              會在半路上永久投降。它一投降，網址規則從那一刻起全部失效，
              而在這之前沒有任何地方會講。

            仍然可能看到的缺口：`✗ OCR 語言是 en-US，不是中文` — 如果你的
            Windows 沒裝中文 OCR 語言包，螢幕上的中文會讀不出來，搜尋中文
            會是空的。到「設定 → 語言 → 選用功能」加裝光學字元辨識。

            ### 這個版本還不會做的事

            尚未達成 Phase 0 的驗收條件：七天連續自錄還沒跑過。
            這一版的足跡數字是照著 alpha.4 的實測改的，但**還沒有在真機上
            重新量過**——如果你的 `足跡：` 那行還是掛著 ⚠，那就是最有用的
            回報，請把整行貼回來。
            沒有 UI、沒有常駐、沒有任何模型呼叫——整份程式碼**零次 LLM 呼叫**。

            隱私承諾與邊界見
            [PRIVACY.md](https://github.com/teddashh/AI-Sister/blob/main/docs/PRIVACY.md)、
            [THREAT_MODEL.md](https://github.com/teddashh/AI-Sister/blob/main/docs/THREAT_MODEL.md)。

            最有價值的回報是：**「這條規則在我的機器上沒有生效。」**
