name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux 上跑的是平台無關的那一半：核心邏輯、L1 抽取、replay、隱私驗證。
  linux:
    name: Linux — test, lint, privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # 敏感排除是 Phase 0 的 exit criteria，值得單獨、顯眼地跑一次
      - name: Privacy — sensitive content must never reach disk
        run: cargo test -p sister-capture --test privacy -- --nocapture

      # PRIVACY.md 說「整個 repo 搜不到 HTTP client」。這一步讓那句話由 CI
      # 保證，而不是由記性保證——缺口通常是相依套件帶進來的，不是人手動加的。
      - name: Privacy — there must be no HTTP client in the shipped binary
        run: ./scripts/check-no-network.sh

      # Windows 那一半在 Linux 上被 cfg 關掉，這裡至少要型別檢查到
      - name: Cross-check the Windows half
        run: ./scripts/check-windows.sh

  # 真正的 Windows：這裡才會連結、才會執行 Win32 的單元測試。
  windows:
    name: Windows — test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 這一步是 Linux 上做不到的事：Win32 程式碼真的被執行
      - name: Test
        run: cargo test --workspace

      # runner 預設只有英文 OCR，於是「中文會不會被逐字切開」這一題永遠停在
      # 「跳過」——而那是這個產品的主要語言。裝上繁中語言包讓它真的被驗到。
      #
      # 只在打 tag 或手動觸發時跑：`Add-WindowsCapability` 要跟 Windows Update
      # 要一份 FOD，實測會掛在那裡超過 20 分鐘（很可能被 runner 的網路擋掉）。
      # 每次 push 都付這個代價不值得，但每次發版驗一次值得。
      # timeout + continue-on-error 是為了讓它最壞情況只是浪費幾分鐘，不會卡死。
      - name: Install Traditional Chinese OCR language pack
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 8
        shell: powershell
        run: |
          foreach ($cap in @("Language.Basic~~~zh-TW~0.0.1.0", "Language.OCR~~~zh-TW~0.0.1.0")) {
            Write-Host "Installing $cap"
            try { Add-WindowsCapability -Online -Name $cap -ErrorAction Stop | Out-Null }
            catch { Write-Host "  failed: $_" }
          }
          Get-WindowsCapability -Online -Name "Language.OCR*" |
            Where-Object State -eq Installed | Select-Object -ExpandProperty Name

      # 微軟的文件說 Windows.Media.Ocr 需要 package identity，也就是這支
      # 沒打包的 exe 理論上叫不動它。實務上叫得動——這一步就是把「理論上」
      # 換成實測。--nocapture 是為了讓辨識結果直接印在 log 裡：CI 記錄的是
      # 這台機器上裝了哪些 OCR 語言、以及中文到底有沒有被逐字切開。
      - name: OCR — really run it on real Windows
        run: cargo test -p sister-capture --test windows_ocr -- --nocapture

      # 抓圖的耗時只能在真的 Windows 上量。--nocapture 讓那張表進 CI log，
      # 換一種抓法就換一組數字——這是目前唯一不靠 Ted 的機器就拿得到
      # 真實數字的管道。第一次量到的結果就推翻了一個我算得很漂亮、方向
      # 卻是反的推論（縮圖比不縮貴一倍）。
      # `--release` 不是可有可無：debug build 量到的「原生 141.9 ms」裡有
      # 一大半是 Rust 端沒最佳化的像素搬運迴圈，而那個數字曾經被拿來當作
      # 縮圖有沒有用的證據。量錯的東西比不量更糟。
      - name: Screen capture — how expensive is each way, on real Windows
        run: cargo test --release -p sister-capture --lib windows::screen -- --nocapture

      - name: Build release
        run: cargo build --release -p sister-cli

      # Phase 0 的 exit criteria，在真正的 Windows 上驗一次：
      # 「sister query 電話 能撈回三天前畫面上的電話，附出處」。
      # 斷言看 JSON 裡的正規化值，避免主控台的中文編碼影響判定。
      - name: Smoke test — Phase 0 exit criterion on real Windows
        shell: bash
        run: |
          set -euo pipefail
          S=./target/release/sister.exe
          $S --version
          $S --data-dir ./smoke doctor
          $S --data-dir ./smoke replay scenarios/bill-lookup.json --days-ago 3
          $S --data-dir ./smoke stats

          $S --data-dir ./smoke query 電話 --json > out.json
          cat out.json
          grep -q '"+886800080123"' out.json \
            || { echo "::error::query 電話 沒有撈回三天前的客服電話"; exit 1; }
          grep -q '"frame_id"' out.json \
            || { echo "::error::答案沒有附出處"; exit 1; }

      # 上面那一段走的是 replay，也就是**真正的擷取迴圈一行都沒被執行過**。
      # alpha.4 三個缺陷全部長在那條路上：抓圖、去重、寫檔、報告。它們在
      # Linux 上跑得好好的，在 Ted 的機器上一起壞掉，而中間沒有任何一關。
      #
      # 這裡把迴圈真的跑起來。runner 的桌面幾乎不動，所以「保留了幾張」
      # 不能拿來斷言——會 flaky。能斷言的是**報告有沒有解釋得了自己**：
      # 時間表把每個階段加起來之後，剩下沒歸因到的那一段必須是小的。
      # 那一行是這份效能報告對自己的誠實度檢查，拿它當關卡，等於「以後
      # 有人加了一個沒被量到的階段，CI 會先發現」。
      - name: Capture loop — really run it on real Windows
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          S=./target/release/sister.exe
          # 導向管線時 Rust 直接寫 UTF-8 位元組（不走 WriteConsoleW），
          # 所以這裡可以拿中文當關鍵字——讀不到就當成失敗，不要靜靜放過。
          $S --data-dir ./loop record --duration 8 2>&1 | tee rec.txt

          grep -q '時間：' rec.txt \
            || { echo "::error::錄完了卻沒印出時間表——CPU 又變成一個沒有下一步的數字"; exit 1; }
          if grep -q '這段沒歸因到任何階段' rec.txt; then
            echo "::error::時間表解釋不了自己：有一段 CPU 沒有任何階段認領"
            exit 1
          fi

          # runner 上沒有人碰鍵盤滑鼠，所以「沒動就不看螢幕」一定要生效。
          # 這一條在 Linux 上測不到——`GetLastInputInfo` 只有 Windows 有，
          # 而單元測試餵的是假的閒置時間。真的接上去了沒有，只有這裡知道。
          grep -q '省下：' rec.txt \
            || { echo "::error::閒置時照樣每個 tick 都去搬畫面——省電那條路沒有接上"; exit 1; }

          # 一個 tick 只准讀一次螢幕。這一行是 alpha.7 那個「探測圖倒賠」的
          # 墓碑：它自己印出來過一次，然後那個階段就被刪掉了。再出現代表
          # 它以某種形式長回來了。
          if grep -q '探測' rec.txt; then
            echo "::error::時間表上又出現探測階段了——一個 tick 應該只讀一次螢幕"
            exit 1
          fi

      - name: Upload sister.exe
        uses: actions/upload-artifact@v4
        with:
          name: sister-windows-x64
          path: target/release/sister.exe
          if-no-files-found: error
          retention-days: 30

  # 打 tag 才發 release，這樣才有一個不用登入就能下載的連結。
  release:
    name: Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sister-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: sister.exe
          generate_release_notes: true
          body: |
            單一執行檔，不需要安裝，沒有任何外掛 DLL 或模型檔。

            ```
            sister.exe doctor                 # 先看這個：她在這台機器上做得到什麼
            sister.exe record --duration 60   # 錄一分鐘（省略 --duration 就錄到 Ctrl-C）
            sister.exe stats                  # 記了多少
            sister.exe query 電話             # 查，每筆都附出處
            sister.exe prune --dry-run        # 保留期現在會刪掉什麼
            ```

            資料放在 `%APPDATA%\ted-h\AI-Sister\data\`，刪掉那個資料夾就等於
            全部忘掉。也可以用 `--data-dir .\test` 錄到別的地方，測完直接刪。

            ### 先跑 `doctor`

            它會誠實列出**現在失效的東西**，而不是報一排 ✓。而且它的每一個 ✓
            都是**真的做成了一件事**，不是「某個物件建得起來」——alpha.1 就是
            在這裡騙了自己：`✓ OCR 語言 zh-Hant-TW` 是真的，錄一分鐘卻一個字
            都沒進資料庫。現在 `doctor` 會：

            - 讀一張**編進執行檔**的圖（答案已知），印出實際讀到的行數與樣本
            - 讀**你現在這台螢幕**，印出行數、樣本，以及畫面的亮度範圍
              （整張同一個亮度 = 擷取失敗，不是「畫面上沒有字」）
            - **真的裝一次** input hook 再回報，不再憑空宣稱
            - **真的去讀一次**前景視窗的網址（見下）

            ### 這一版：沒有人動的時候，她連螢幕都不看

            前一版為了省 CPU 做了「兩段式抓圖」——每個 tick 先抓一張 256px
            的小圖算雜湊，只有畫面真的變了才付原生解析度的錢。算式很漂亮：
            要搬的位元組從 14MB 掉到 147KB。

            量了之後，那個算式解釋的是一件沒有發生的事：

            ```
            原生 1024x768  28.4 ms      256x192（面積平均）27.4 ms
            512x384        24.6 ms      256x192（丟像素）  24.2 ms
            ```

            **目的地像素差 12 倍，時間差不到 15%。** 擷取的錢花在讀來源，
            不在寫目的地，而那張「便宜的探測圖」讀的是同一個螢幕。它從頭
            到尾沒有便宜過——只是把一張讀完的畫面丟掉，然後再讀一次。

            所以這一版做了兩件事：

            **一、一個 tick 只讀一次螢幕。** 探測圖整個刪掉，dhash 直接從
            那唯一一張算。

            **二、沒有人動就完全不讀。** 從上次看螢幕到現在沒有人碰過鍵盤
            滑鼠，畫面就多半沒變——`GetLastInputInfo` 回答這件事只要一次
            系統呼叫。同一台 CI 機器上：

            ```
            之前   19 tick、每 tick 40 ms、讀螢幕 20 次、CPU 3.5%
            之後   20 tick、每 tick 13 ms、讀螢幕  2 次、CPU 2.5%
            ```

            （中間有一版量到 1.9%，那是還留著探測圖的時候。探測圖刪掉之後
            數字反而略高一點——因為省下來的那一次是**沒抓成的探測**，本來就
            比較便宜。用出貨的這版量到的數字，不用中途最好看的那個。）

            「多半沒變」不是「一定沒變」，所以有上限：**最多 5 秒一定會睜眼
            一次**，換了視窗或標題也會立刻睜眼。剩下的盲區是「畫面自己在動、
            而且連標題都沒變」——影片、進度條。那是一個真的缺口，寫在
            DATA_INVENTORY 的「已知缺口」第 5 條。

            而且省下幾次一定會印出來（`省下：18 次沒碰螢幕（90%）`）。省電
            和停止工作在帳面上長得一模一樣：tick 照跑、沒有錯誤、CPU 很漂亮
            ——而畫面上看不出來她其實閉著眼睛。

            怎麼發現的值得一提：時間表上探測一直是第一名，而排第一很正常。
            後來加了一行叫它自己結帳（省下的＝沒抓成的次數 × 抓一次多少，
            成本＝探測全部），它第一次跑就印了

            ```
            ⚠ 探測圖倒賠：花了 0.05 秒去省 0.02 秒（1 次沒抓成 × 18.2 ms）
            ```

            **一個為了省錢而存在、結果自己變成最大開銷的階段，跟單純的
            第一名長得一模一樣**——除非你叫它交帳。

            ### 這一版：三個「查不回來」的東西，現在查得回來

            都是同一個形狀——寫進資料庫、然後沒有任何一行程式讀它。

            **一、排除稽核。** DATA_INVENTORY 說 `system_events` 的 `excluded`
            那一列「是稽核用的，沒有它使用者無法驗證排除真的生效了」。而
            codebase 對這張表只做過 INSERT、COUNT(\*)、DELETE 三件事：理由字串
            只有錄製當下印得出來，關掉終端機就再也叫不回來。`sister stats`
            現在把它依理由分組讀回來。

            寫這段的時候自己踩了一次：第一版標題印「N 次擷取因為隱私規則沒有
            發生」，拿測試腳本一跑，錄製摘要說 16000、stats 說 2。因為 recorder
            只在**踏進**一段排除狀態時寫一列，資料庫裡是「段」不是「張」。
            兩個數字各自都對，只是我把其中一個的名字安在另一個上面。

            **二、「內容沒有落地」。** 這是這份專案最強的一句承諾，而讀
            `secret_suspected` 的地方只有一個單元測試。現在 `stats` 會查，
            而且刻意不去數旗子：

            ```sql
            SELECT COUNT(*), SUM(text IS NOT NULL)
            FROM clipboard_events WHERE secret_suspected = 1
            ```

            旗子是寫入時的自我宣稱，第二個數字才是資料庫此刻的實際狀態。
            **旗子插了但字還在**，是這句承諾唯一的失敗方式，而且它不會報錯。

            **三、`facts` 的「信心」欄位——這個是直接刪掉。** 每條 regex 手寫
            一個 0.85～0.97，寫進每一列、印在你眼前（`信心 0.93`）、出現在
            JSON 裡。然後沒有任何一行程式讀它。連它自己的註解宣稱的用途都是
            假的。把所有值改成 0.5，99 個測試全過。

            一個沒有來源、沒人讀、卻長得像機率的數字，比沒有這個數字更糟。
            資料庫升到 schema v2 會自動把欄位拿掉（舊資料一列都不會掉）。

            順帶：`sister facts` 撈滿上限時會講了（`query` 上一版才修過同一個
            bug），`--json` 也從裸陣列包成信封帶上 `limit` / `truncated`
            ——裸陣列講不出「後面還有」。

            ### 這一版：時鐘往回跳不會讓她安靜地停工

            NTP 校時、使用者手動改時間，都會讓「現在 − 上次」變成負數。同一個
            `saturating_sub` 把它夾成 0 的寫法，在三個地方各自造成一次**永久
            失效**：存圖的節流、閒置時的睜眼上限、打字節奏的統計視窗。

            三個都一樣不會報錯：tick 照跑、CPU 漂亮、沒有任何錯誤訊息，只是
            那個子系統從此不再做事。`saturating_sub` 用在時間差上永遠可疑
            ——它把一件不可能發生的事變成一個看起來很正常的 0。

            ### 保留期真的會刪東西了（alpha.5 起）

            `RetentionConfig` 一直都在，`doctor` 一直印著「保留期　畫面 30 天」，
            THREAT_MODEL 還把它列為爆炸半徑控制——而在這一版之前，**整份程式碼
            裡沒有任何一行 DELETE**。磁碟會一直長，而且沒有任何一刻會出事，
            所以沒有人會發現。

            - 過 30 天：刪掉 PNG 檔本身，**但保留那一列與它上面的字**。
              三個月前那通客服電話還查得到，只是點不開當時的截圖。
            - 過 365 天：整列連同文字、事實、FTS 索引一起消失。
            - 每次開始錄製時自動跑一次（不是收工時——收工有太多種方式不會
              發生：Ctrl-C、當機、關機、拔電）。
            - `sister prune --dry-run` 先看會刪掉什麼，一個位元組都不動。

            ### 這一版：把量到的那三個數字修回預算內

            alpha.4 第一次量得到自己，然後量出來的東西很難看：
            **CPU 27.1%（預算 3%）、磁碟 11.4 GB/天（預算 300MB/天）**，
            而且 OCR 把 `Microsoft Teams` 讀成 `Micr099ftTeamsTr`。

            三個症狀是同一個原因：**一份像素同時被拿去做三件需求互相衝突
            的事**。去重只需要 9×8、OCR 需要原生解析度、存檔想要小，而它們
            共用一張縮到 1568 的圖——對三邊都是錯的。

            - **兩段式抓圖。**（這一條已經被實測推翻並且整個刪掉了，
              見上面那一段。留在這裡是因為它解釋了下一條為什麼存在。）
            - **OCR 改看原生像素。** 2560 縮到 1568 是 0.61 倍，12px 的字掉到
              7px，於是引擎不報錯、只是讀錯。
            - **畫面檔兩道閘門**：最小間隔（預設 5 秒）管速率，每日上限
              （預設 250MB）管總量。單靠間隔擋不住——5 秒一張的最壞情況
              一天還是 17,280 張。
              **被跳過的只有 PNG，文字照常全部進索引**：搜尋結果一筆都不會
              少，只是其中一些點下去沒有圖。摘要會直接講這件事。

            錄完的摘要現在還會把時間拆到每個階段。下面是 CI 那台
            windows-latest runner 上**真的跑出來**的（1024×768、閒置桌面；
            你的機器不會長這樣）：

            ```
            時間：20 tick 佔了 0.3 秒（每 tick 13 ms）；其中真的燒掉 0.2 秒 CPU，
                  其餘是等（多半在顯示驅動裡）
                  OCR    0.13 秒 / 47%    1 次，每次 125.9 ms
                  抓圖   0.03 秒 / 12%    1 次，每次  33.4 ms
                  存檔   0.01 秒 /  2%    1 次，每次   5.7 ms
                  其他   0.01 秒 /  5%   （沒歸因到任何階段）
            ```

            牆上時間和 CPU 分開印，是因為它們回答的是不同的問題：0.3 秒裡
            只有 0.2 秒真的在燒 CPU，其餘是在等顯示驅動。抱怨「CPU 27%」的
            人要看的是後面那個數字。

            會有這一段，是因為我為了那個 27% 猜了兩次原因，兩次都猜 PNG
            編碼太慢，兩次都錯（實測編一張只要 1.7ms）。**一個沒辦法歸因的
            數字，會讓人去修最好修的地方，而不是最貴的地方。**

            最後那行「其他」是這份報告**對自己的誠實度檢查**：它是整個 tick
            的時間減掉所有階段的總和。它小，代表上面的排名真的解釋了 CPU
            花到哪裡；它大（超過 25% 會掛 ⚠），代表最貴的東西根本沒被量到，
            而排第一的那一項只是「被量到的裡面最大的」。CI 現在會在真的
            Windows 上跑一次錄製，看到那個 ⚠ 就讓建置失敗。

            磁碟也同理，現在拆成「畫面」與「其他」，超出預算她會自己說。

            `doctor` 現在也會在你按下 record 之前就先講「多久存一張、一天
            最多存多少」——那筆點下去沒有圖的搜尋結果不該是個驚喜。

            ### 順手把兩個沒有人讀的設定處理掉

            把 17 個設定項一個一個 grep 過「到底有沒有人讀它」，抓到兩個：

            - `heartbeat_secs` 描述的是事件驅動架構的保底心跳，而 Phase 0
              是輪詢的——輪詢本身就是心跳。**刪掉**。
            - `input_window_secs` 更糟，旁邊還配著一份寫錯的文件：設定寫
              10 秒、DATA_INVENTORY 也寫「每 10 秒一列」，而實際上 recorder
              每 400ms 叫一次就寫一列，打字時是**一秒 2.5 列**。**實作它**，
              順便讓那句文件變成真的。

            還有一個是我自己在同一批改動裡做出來的：每日畫面額度原本只記在
            記憶體裡，關掉再開就重拿一份，一天重開十次就是十倍額度。
            **一個重開就能繞過的上限不是上限**，現在啟動時會從資料庫接回
            今天已經用掉的量。

            ### 網址與密碼欄（UIA，alpha.3 起）

            在那之前 `doctor` 會說「✗ 沒有 UIA 網址擷取」，那代表 16 條
            網銀／登入頁排除規則**一條都不生效**。現在接上了：

            - **只對瀏覽器呼叫**。UIA 的呼叫沒有辦法取消，對方卡住我們就跟著
              卡住，所以一天裡絕大多數時間完全不碰它——那本身就是一項功能。
              代價：非瀏覽器（RDP 登入框、VPN 用戶端）的密碼欄看不到。
            - **關在一條可以丟掉的執行緒裡**。卡超過 0.9 秒就整條放棄、不等它。
              連續放棄三次就宣告這台機器讀不到網址，不再嘗試。
            - **焦點在密碼欄上時整幀不擷取**。問不出來也算「是」——少擋了你
              永遠不會發現，多擋了你會來抱怨然後我們修得掉。
            - 讀回來的網址是**縮寫過的**（`example.com/a`，不是
              `https://www.example.com/a`）。規則是子字串比對所以照樣命中，
              但寫成 `https://*bank*` 的規則永遠不會生效——`doctor` 會把這種
              規則挑出來。

            ### 錄完的摘要現在說得出「為什麼」

            - `讀字：N 行` — 保留了幾張畫面是**容量**，讀到了幾行字才是**記憶**。
              `kept > 0` 而讀字 = 0 會直接示警，OCR 失敗也會印出是哪一步壞的。
            - `排除 N 次：<理由>` — 拆開到每一條規則。一條寬到吃掉一整天的
              規則，症狀本來只是一個沒有解釋的數字。
            - `⚠ 錄製途中失去的能力` — `doctor` 只看得到開機那一瞬間，但 UIA
              會在半路上永久投降。它一投降，網址規則從那一刻起全部失效，
              而在這之前沒有任何地方會講。

            仍然可能看到的缺口：`✗ OCR 語言是 en-US，不是中文` — 如果你的
            Windows 沒裝中文 OCR 語言包，螢幕上的中文會讀不出來，搜尋中文
            會是空的。到「設定 → 語言 → 選用功能」加裝光學字元辨識。

            ### 這個版本還不會做的事

            尚未達成 Phase 0 的驗收條件：七天連續自錄還沒跑過。

            上面所有的數字都來自 CI 那台 1024×768 的虛擬機。**2560×1440 的
            真機還沒有量過**，而 alpha.4 在你機器上量到的是 CPU 27.1%、
            磁碟 11.4 GB/天。最有用的回報就是那三行：

            ```
            sister.exe --data-dir .\test record --duration 60
            ```

            把 `完成：`、`省下：`、`時間：`、`足跡：` 四行整段貼回來就好。
            特別想知道兩件事：`省下：` 那行的百分比（你邊用電腦邊錄的話應該
            會低很多），以及 `其他` 那一項有沒有掛 ⚠（掛了就代表最貴的東西
            根本沒被量到，上面的排名是假的）。
            沒有 UI、沒有常駐、沒有任何模型呼叫——整份程式碼**零次 LLM 呼叫**。

            隱私承諾與邊界見
            [PRIVACY.md](https://github.com/teddashh/AI-Sister/blob/main/docs/PRIVACY.md)、
            [THREAT_MODEL.md](https://github.com/teddashh/AI-Sister/blob/main/docs/THREAT_MODEL.md)。

            最有價值的回報是：**「這條規則在我的機器上沒有生效。」**
