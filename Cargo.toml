[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/teddashh/AI-Sister"
authors = ["Ted Huang <ted@ted-h.com>"]

[workspace.dependencies]
sister-core = { path = "crates/sister-core" }
sister-capture = { path = "crates/sister-capture" }
sister-cli = { path = "crates/sister-cli" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
